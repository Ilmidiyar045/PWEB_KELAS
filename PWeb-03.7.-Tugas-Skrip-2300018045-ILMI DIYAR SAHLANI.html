<!DOCTYPE html>
<html>
<head>
    <title>Tugas HTML Pangkat</title>
</head>
<body>

    <h1>Format Pangkat Atas dan Bawah</h1>

    <p>
        Rumus air adalah H<sub>2</sub>O
    </p>

    <p>
        Rumus karbon dioksida adalah CO<sub>2</sub>
    </p>

    <p>
        Rumus matematika:
        x<sup>2</sup> + y<sup>2</sup>
    </p>

    <p>
        10<sup>3</sup> = 1000
    </p>

    <p>
        Saya sedang belajar HTML dasar menggunakan format superscript dan subscript.
    </p>

</body>
</html>
